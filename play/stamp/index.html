.intro { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; align-content: center; gap: 14px; padding: 16px;
  background: radial-gradient(ellipse at 50% 40%, #f4e6c4, #d9bf8c 70%, #b8935e); color: #4a2f1a; opacity: 0; transition: opacity 0.4s; touch-action: none; }
.intro.on { opacity: 1; }
.intro svg.stage { width: min(92vw, 62vh, 460px); height: auto; border-radius: 22px; box-shadow: 0 10px 30px rgba(60,30,10,0.35), 0 0 0 5px #8a3a22, 0 0 0 9px #e8c27a; background: #f6e7c2; }
.intro .cap { min-height: 3.2em; max-width: min(92vw, 460px); text-align: center; font-size: 18px; line-height: 1.35; font-weight: 600; background: #fff7e2; padding: 10px 18px; border-radius: 16px; box-shadow: 0 4px 14px rgba(60,30,10,0.25); display: grid; place-items: center; }
.intro .cap span { animation: capIn 0.45s cubic-bezier(.2,1.4,.4,1); }
.intro .cap b { color: ${Hu}; }
@keyframes capIn { from { opacity: 0; transform: translateY(8px) scale(0.96); } }
.intro .go { font: inherit; font-size: 20px; font-weight: 800; border: 0; border-radius: 16px; padding: 12px 34px; background: #3fae6a; color: #fff; box-shadow: 0 5px 0 #2b7f4b, 0 8px 16px rgba(0,0,0,0.25); cursor: pointer; visibility: hidden; }
.intro .go:active { transform: translateY(4px); box-shadow: 0 1px 0 #2b7f4b; }
.intro.s4 .go { visibility: visible; animation: capIn 0.5s 0.4s cubic-bezier(.2,1.6,.4,1) both, goPulse 1.2s 1s ease-in-out infinite; }
@keyframes goPulse { 50% { scale: 1.07; } }
.intro .skip { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 14px; font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 999px; padding: 8px 16px; background: rgba(74,47,26,0.75); color: #fff8ec; cursor: pointer; }
.intro .dots { display: flex; gap: 7px; }
.intro .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(74,47,26,0.25); transition: background 0.3s, scale 0.3s; }
.intro .dots i.on { background: ${Hu}; scale: 1.25; }

.intro .scene { opacity: 0; transition: opacity 0.5s; }
.intro.s1 .village, .intro.s2 .village, .intro.s3 .table, .intro.s4 .table, .intro.s2 .painter, .intro.s4 .painter, .intro.s4 .finale { opacity: 1; }
.intro .sun { transform-box: fill-box; transform-origin: center; }
.intro.s1 .sun { animation: rise 1.6s cubic-bezier(.2,1,.4,1) both; }
.intro .rays { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
@keyframes rise { from { transform: translateY(70px); } }
@keyframes spin { to { transform: rotate(360deg); } }
.intro .sheet { transform-box: fill-box; transform-origin: 50% 100%; }
.intro.s1 .sheet { animation: pop 0.5s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes pop { from { transform: scale(0) rotate(-20deg); } }
.intro .smoke { animation: smoke 3s ease-in-out infinite; }
@keyframes smoke { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 0.6; } 100% { opacity: 0; transform: translate(14px, -40px); } }

.intro .painter-in { transform-box: fill-box; transform-origin: 50% 100%; }
.intro.s2 .painter-in, .intro.s4 .painter-in { animation: hop 0.7s cubic-bezier(.2,1.6,.4,1) both, bounce 1.4s 0.7s ease-in-out infinite; }
@keyframes hop { from { transform: translateY(80px) scale(0.6); } }
@keyframes bounce { 50% { transform: translateY(-4px); } }
.intro .arm-wave { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 0.6s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
.intro .painter-at { transform: translate(272px, 198px); transition: transform 0.6s cubic-bezier(.3,1.2,.4,1); }
.intro.s4 .painter-at { transform: translate(64px, 262px) scale(0.85); }

.intro .layer { opacity: 0; transform-box: fill-box; transform-origin: center; }
.intro .layer.on { opacity: 1; animation: inked 0.35s ease-out; }
@keyframes inked { from { opacity: 0; transform: scale(1.04); filter: blur(1.5px); } }
.intro .block { opacity: 0; transform-box: fill-box; transform-origin: center; }
.intro .block.press { animation: press 1.05s cubic-bezier(.5,0,.4,1) both; }
@keyframes press {
  0% { opacity: 0; transform: translate(70px, -60px) scale(1.4) rotate(8deg); }
  25% { opacity: 1; }
  44% { transform: translate(0, 0) scale(1.02); }
  52% { transform: scale(0.97, 0.96); }
  62% { opacity: 1; transform: scale(1.03); }
  100% { opacity: 0; transform: translate(-70px, -60px) scale(1.4) rotate(-8deg); }
}
.intro .print { transition: transform 0.6s cubic-bezier(.3,1.2,.4,1); }
.intro.s4 .print { transform: translate(10px, -6px); }
.intro .seal { transform-box: fill-box; transform-origin: center; opacity: 0; }
.intro.s4 .seal { animation: seal 0.5s 0.5s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes seal { from { opacity: 0; transform: scale(2.4) rotate(-30deg); } to { opacity: 0.92; transform: rotate(-12deg); } }
.intro .bit { transform-box: fill-box; opacity: 0; }
