<!DOCTYPE html>
<!--
PROTOTYPE - NOT FOR PRODUCTION
Question: Will a shrunk-down, touch-friendly flood-fill puzzle built from
irregular polyomino pieces (not a plain per-cell grid) be instantly
understandable and satisfying on mobile, without instructions?
Date: 2026-08-11
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flood Mobile — Prototype</title>
<style>
  :root {
    --bg: #14181f;
    --panel: #1d232d;
    --text: #eef1f5;
    --muted: #8a93a3;
    --accent: #4f8cff;
    --win: #35c98f;
    --lose: #ff5c5c;
    --hidden-bg: #8b919b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh; /* real device chrome (status/gesture bars) shrinks this vs. 100% on some WebViews */
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 16px) + 12px);
    height: 100%;
    overflow-y: auto; /* safety net — the board sizes itself to avoid needing this in the normal case */
    gap: 14px;
  }

  h1 {
    font-size: 1.25rem;
    margin: 8px 0 0;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: -8px 0 0;
    text-align: center;
  }

  .hud {
    display: flex;
    align-items: stretch;
    gap: 10px;
    width: 100%;
    max-width: 480px;
  }

  .stat {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 12px;
    text-align: center;
  }

  .stat .label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .stat .value {
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1.2;
  }

  /* Compact restart control living in the HUD row itself (real mobile games
     put "restart" as a small icon near the score/status readout, not as a
     full labeled button below the board) — replaces the old full-width
     "Chơi lại" button in #controls. */
  #retryIconBtn {
    flex: 0 0 auto;
    width: 52px;
    border: 0;
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
  }

  #retryIconBtn:active { transform: scale(0.94); }

  /* boardWrap only exists to give layoutBoard() a stable pixel width to
     measure — the board itself is sized in exact integer pixels by JS so
     cells always come out perfectly square (see layoutBoard()). */
  #boardWrap {
    width: min(94vw, 480px);
    flex: 1 1 auto;
    min-height: 0; /* required for a flex child to actually shrink below its content size */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #board {
    display: grid;
    gap: 3px;
    background: var(--panel);
    padding: 6px;
    border-radius: 14px;
    position: relative;
  }

  .cell {
    position: relative;
    /* Above #territoryLayer so per-cell marks (★, ?, ice countdown) stay
       readable — the overlay would otherwise paint over them. The overlay
       still shows through in the grid gaps, which is all it needs for the
       bridges and the surrounding outline. */
    z-index: 1;
    border-radius: 6px;
    transition: background-color 120ms ease, border-color 120ms ease;
  }

  /* Small filler rectangles that bridge the grid gap between two cells of
     the same group (same not-yet-captured piece, or both part of the
     captured territory) so they read as one seamless rounded shape instead
     of separate tiles. Positioned/sized in JS (renderBoard()) to exactly
     span the gap, using the same pixel math as layoutBoard(). */
  .bridge {
    position: absolute;
    pointer-events: none;
  }

  /* The captured region is redrawn as one composite shape on its own layer
     (its cells + the bridges between them), so the chained drop-shadow
     filter can trace a single continuous white line all the way around the
     region's real outer perimeter — around the bridges too. A per-cell CSS
     border cannot do this: it paints inside each cell's own box and breaks
     at every grid gap. Chaining 4 axis drop-shadows dilates the shape's
     alpha by a square, which reads as an even outline hugging the rounded
     corners. */
  #territoryLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    filter:
      drop-shadow(3px 0 0 #ffffff)
      drop-shadow(-3px 0 0 #ffffff)
      drop-shadow(0 3px 0 #ffffff)
      drop-shadow(0 -3px 0 #ffffff);
  }

  #territoryLayer .tshape {
    position: absolute;
  }

  .cell .glyph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    pointer-events: none;
    font-size: 0.85em;
  }

  /* Frozen blocks: a translucent frost sheet over the piece's real colour
     (the colour still has to read through, since knowing it is what makes
     an ice block worth planning around) plus diagonal crystal streaks and
     a bright top edge to sell the "sheet of ice" look. Drawn as ::before so
     the countdown glyph, a later child, stays on top of it. */
  .cell.frozen::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        125deg,
        rgba(255, 255, 255, 0.38) 0px, rgba(255, 255, 255, 0.38) 2px,
        rgba(255, 255, 255, 0) 2px, rgba(255, 255, 255, 0) 7px
      ),
      linear-gradient(
        150deg,
        rgba(232, 249, 255, 0.62) 0%,
        rgba(150, 205, 240, 0.48) 55%,
        rgba(205, 240, 255, 0.60) 100%
      );
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, 0.75),
      inset 0 -3px 5px rgba(70, 130, 175, 0.45);
  }

  /* Same frost over the gap-filling bridges, so a multi-cell ice block
     freezes as one sheet instead of showing untinted seams. */
  .bridge.frozen {
    background-image:
      repeating-linear-gradient(
        125deg,
        rgba(255, 255, 255, 0.38) 0px, rgba(255, 255, 255, 0.38) 2px,
        rgba(255, 255, 255, 0) 2px, rgba(255, 255, 255, 0) 7px
      ),
      linear-gradient(
        150deg,
        rgba(232, 249, 255, 0.62) 0%,
        rgba(150, 205, 240, 0.48) 55%,
        rgba(205, 240, 255, 0.60) 100%
      );
  }

  /* The palette sits in its own tray (panel background + padding), the same
     visual language as the HUD stat boxes — without this, the swatches
     used to float directly on the page background using the exact same
     colors/rounding as the board cells above them, so the whole thing read
     as one continuous surface instead of "board" + "a separate control". */
  #paletteWrap {
    background: var(--panel);
    border-radius: 16px;
    padding: 10px;
    width: min(94vw, 480px);
  }

  #palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  /* Raised-button look: a solid "base" edge plus a soft drop shadow gives
     each swatch real elevation off the tray, and pressing it flattens both
     away while nudging the swatch down — it should read as a physical
     button being pushed, not just a color chip. */
  .swatch {
    height: 56px;
    border: 0;
    border-radius: 14px;
    box-shadow:
      0 10px 0 rgba(0,0,0,0.55),
      0 14px 18px rgba(0,0,0,0.45),
      inset 0 -4px 0 rgba(0,0,0,0.3);
    cursor: pointer;
    transition: filter 120ms ease, opacity 120ms ease, transform 80ms ease, box-shadow 80ms ease;
  }

  .swatch:active {
    transform: scale(0.94) translateY(10px);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.25);
  }

  .swatch.current {
    outline: 3px solid #fff;
    outline-offset: -3px;
  }

  .swatch.dimmed,
  .swatch:disabled {
    filter: brightness(0.4) saturate(0.5);
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25); /* disabled buttons sit flat — no elevation to press down from */
  }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10; /* above .cell's z-index:1 (see .cell comment) so it isn't painted under the board */
    background: rgba(10,12,16,0.82);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    text-align: center;
    padding: 24px;
  }

  #overlay.show { display: flex; }

  #overlayTitle {
    font-size: 1.8rem;
    font-weight: 800;
  }

  #overlayTitle.win { color: var(--win); }
  #overlayTitle.lose { color: var(--lose); }

  #overlayActions {
    display: flex;
    gap: 10px;
  }

  #overlayBtn,
  #overlayNextBtn {
    padding: 12px 28px;
    border: 0;
    border-radius: 12px;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
  }

  #overlayBtn { background: var(--accent); }
  #overlayNextBtn { background: var(--win); }
  #overlayNextBtn.hidden { display: none; }

  /* One-time mechanic intro, shown automatically the first time a level
     that introduces something new loads (see LEVEL_INTROS) — same visual
     language as the win/lose overlay, kept as a separate element so the
     two never have to coordinate state. */
  #tutorialOverlay {
    position: fixed;
    inset: 0;
    z-index: 11; /* above #overlay too, in case both could ever be relevant */
    background: rgba(10,12,16,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #tutorialOverlay.show { display: flex; }

  /* Solid panel behind the text (instead of it floating directly on the
     translucent backdrop) — plain contrast, easier to read. */
  #tutorialCard {
    background: var(--panel);
    border-radius: 20px;
    padding: 28px 24px;
    width: min(92vw, 360px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }

  #tutorialIcon {
    font-size: 2.6rem;
    line-height: 1;
  }

  #tutorialTitle {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--accent);
  }

  #tutorialBody {
    line-height: 1.5;
  }

  #tutorialBtn {
    padding: 12px 28px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
  }
</style>
</head>
<body>

  <h1>Flood Mobile</h1>
  <p class="subtitle">Chạm vào một màu để lan từ điểm khởi đầu. Phủ kín cả lưới trước khi hết lượt.</p>

  <div class="hud">
    <div class="stat">
      <div class="label">Lượt còn lại</div>
      <div class="value" id="movesLeft">--</div>
    </div>
    <div class="stat">
      <div class="label">Level</div>
      <div class="value" id="levelNumLabel">--</div>
    </div>
    <button id="retryIconBtn" title="Chơi lại" aria-label="Chơi lại">↻</button>
  </div>

  <div id="boardWrap"><div id="board"></div></div>

  <div id="paletteWrap"><div id="palette"></div></div>

  <div id="overlay">
    <div id="overlayTitle"></div>
    <div id="overlayDetail" class="subtitle"></div>
    <div id="overlayActions">
      <button id="overlayBtn">Chơi lại</button>
      <button id="overlayNextBtn" class="hidden">Level tiếp theo →</button>
    </div>
  </div>

  <div id="tutorialOverlay">
    <div id="tutorialCard">
      <div id="tutorialIcon"></div>
      <div id="tutorialTitle"></div>
      <div id="tutorialBody" class="subtitle"></div>
      <button id="tutorialBtn">Đã hiểu</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---- Defaults for the built-in starter pack (tune here) ----
  const DEFAULT_W = 8;
  const DEFAULT_H = 8;
  const DEFAULT_COLORS = [
    "#ff6b6b", // red
    "#ffd93d", // yellow
    "#4f8cff", // blue
    "#35c98f", // green
    "#c084fc"  // purple
  ];
  const DEFAULT_MAX_MOVES = 18;
  const STARTER_PACK_SIZE = 5;
  const MIN_PIECE_SIZE = 1;
  const MAX_PIECE_SIZE = 4; // 1x1 up to tetromino-sized (4 cells)
  const BOARD_PADDING = 6; // must match #board CSS padding
  const BOARD_GAP = 3;     // must match #board CSS gap
  const CELL_RADIUS = 6;   // must match .cell CSS border-radius

  const boardWrapEl = document.getElementById("boardWrap");
  const boardEl = document.getElementById("board");
  const paletteEl = document.getElementById("palette");
  const movesLeftEl = document.getElementById("movesLeft");
  const levelNumLabelEl = document.getElementById("levelNumLabel");
  const retryIconBtn = document.getElementById("retryIconBtn");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayDetail = document.getElementById("overlayDetail");
  const overlayBtn = document.getElementById("overlayBtn");
  const overlayNextBtn = document.getElementById("overlayNextBtn");
  const tutorialOverlay = document.getElementById("tutorialOverlay");
  const tutorialIcon = document.getElementById("tutorialIcon");
  const tutorialTitle = document.getElementById("tutorialTitle");
  const tutorialBody = document.getElementById("tutorialBody");
  const tutorialBtn = document.getElementById("tutorialBtn");

  // Mechanic intros, keyed by 0-based pack index — shown once, automatically,
  // the first time the player reaches the level that introduces that
  // mechanic (levels 1-7 are hand-authored tutorials, so index 3 = level 4,
  // index 7 = level 8). Since there's no Back button anymore, a normal
  // playthrough hits each index exactly once on the way up.
  const LEVEL_INTROS = {
    3: {
      icon: "❓",
      title: "Cơ chế mới: Ẩn màu",
      body: "Khối màu xám có dấu \"?\" đang giấu màu thật của nó. Khi vùng bạn chiếm được lan tới sát nó, màu thật sẽ lộ ra — nhưng lộ màu không có nghĩa là chiếm được, bạn vẫn phải chọn đúng màu đó ở một lượt khác."
    },
    7: {
      icon: "❄️",
      title: "Cơ chế mới: Băng",
      body: "Khối phủ băng kèm số đếm ngược sẽ bị đóng băng trong vài lượt — dù đúng màu cũng không chiếm được lúc này. Mỗi lượt đi (ở bất kỳ đâu trên bàn) số đếm giảm 1; về 0 là tan băng và chiếm được ngay."
    }
  };

  function showLevelIntroIfAny(packIdx) {
    const info = LEVEL_INTROS[packIdx];
    if (!info) return;
    tutorialIcon.textContent = info.icon;
    tutorialTitle.textContent = info.title;
    tutorialBody.textContent = info.body;
    tutorialOverlay.classList.add("show");
  }

  tutorialBtn.addEventListener("click", () => {
    tutorialOverlay.classList.remove("show");
  });

  // ---- Level pack: an ordered list of levels, advanced only by winning
  // (see overlayNextBtn) — built once at startup. ----
  let pack = [];
  let packIndex = 0;

  // ---- Current level state (mutable — set from pack[packIndex]) ----
  let W = DEFAULT_W;
  let H = DEFAULT_H;
  let COLORS = DEFAULT_COLORS.slice();
  let MAX_MOVES = DEFAULT_MAX_MOVES;
  let startIndex = 0;
  let cellPieceId = [];         // static per-cell piece id, fixed for the level's lifetime
  let originalPieceColors = []; // color index per piece id, as the level starts (for retry)
  let pieceMechanics = [];      // {type:'normal'|'hidden'|'ice', turns?} per piece id, fixed for the level's lifetime
  let levelName = "";

  // ---- Derived per-level structure (rebuilt whenever cellPieceId changes) ----
  let pieceCells = [];     // pieceId -> [cell indices]

  // ---- DOM bookkeeping for rendering ----
  let cellEls = [];        // cell index -> its .cell element (indexed directly, not via boardEl.children,
                            // since .bridge filler elements also live in #board as siblings)
  let bridgeEls = [];      // board-level .bridge elements from the current renderBoard() pass, for cleanup
  let territoryLayer = null; // overlay holding the captured region's composite shape (see CSS #territoryLayer)
  let currentCellSize = 0; // last computed pixel size per cell, from layoutBoard() — reused to position bridges

  // ---- Per-play state ----
  let grid = [];              // current color index per cell (mutates as you play)
  let filled = new Set();     // cell indices currently part of the captured territory
  let iceRemaining = [];      // pieceId -> turns left frozen (0 = thawed / not ice)
  let currentColor = 0;
  let movesLeft = MAX_MOVES;
  let gameOver = false;

  function idx(x, y) { return y * W + x; }

  function neighborsOf(i) {
    const x = i % W, y = Math.floor(i / W);
    const list = [];
    if (x > 0) list.push(i - 1);
    if (x < W - 1) list.push(i + 1);
    if (y > 0) list.push(i - W);
    if (y < H - 1) list.push(i + W);
    return list;
  }

  // Randomly tiles a w*h grid with connected polyomino pieces of
  // MIN_PIECE_SIZE..MAX_PIECE_SIZE cells (1x1, dominoes, L/T/S/Z/I-ish
  // tetromino shapes emerge naturally from the random growth walk). The
  // starter pack only ever produces plain "normal" pieces — hidden/ice
  // blocks are a hand-authoring tool (see editor.html), not randomized.
  function generateRandomPieces(w, h, colorCount) {
    const total = w * h;
    const pieceId = new Array(total).fill(-1);
    let nextId = 0;

    function neighborsIn(i) {
      const x = i % w, y = Math.floor(i / w);
      const list = [];
      if (x > 0) list.push(i - 1);
      if (x < w - 1) list.push(i + 1);
      if (y > 0) list.push(i - w);
      if (y < h - 1) list.push(i + w);
      return list;
    }

    for (let start = 0; start < total; start++) {
      if (pieceId[start] !== -1) continue;
      const id = nextId++;
      pieceId[start] = id;
      const targetSize = MIN_PIECE_SIZE + Math.floor(Math.random() * (MAX_PIECE_SIZE - MIN_PIECE_SIZE + 1));
      let frontier = neighborsIn(start).filter(n => pieceId[n] === -1);
      let size = 1;
      while (size < targetSize && frontier.length > 0) {
        const pos = Math.floor(Math.random() * frontier.length);
        const pick = frontier[pos];
        frontier.splice(pos, 1);
        if (pieceId[pick] !== -1) continue;
        pieceId[pick] = id;
        size++;
        for (const n of neighborsIn(pick)) {
          if (pieceId[n] === -1 && !frontier.includes(n)) frontier.push(n);
        }
      }
    }

    const colors = new Array(nextId);
    for (let p = 0; p < nextId; p++) colors[p] = Math.floor(Math.random() * colorCount);
    const mechanics = new Array(nextId).fill(null).map(() => ({ type: "normal" }));
    return { pieceId, colors, mechanics };
  }

  // Fallback pack used only when the curated levels/ set can't be loaded
  // (see buildStarterPack() below) — e.g. opening prototype.html directly
  // as a file:// page, where browsers block fetch() to sibling files.
  function buildRandomStarterPack(n) {
    const levels = [];
    for (let i = 0; i < n; i++) {
      const { pieceId, colors, mechanics } = generateRandomPieces(DEFAULT_W, DEFAULT_H, DEFAULT_COLORS.length);
      levels.push({
        name: `Level ${i + 1}`,
        w: DEFAULT_W,
        h: DEFAULT_H,
        colors: DEFAULT_COLORS.slice(),
        maxMoves: DEFAULT_MAX_MOVES,
        startIndex: 0,
        pieceMap: pieceId,
        pieceColors: colors,
        pieceMechanics: mechanics
      });
    }
    return levels;
  }

  // Relative "levels/…" resolves correctly from a local *.html file, from
  // a clean URL like ".../prototype" (its "directory" really is this
  // folder), and from an app root "/" (Capacitor serves index.html at
  // https://localhost/, pathname "/" — same directory-relative case), but
  // not from a Vercel pretty route like "/flood" — the rewrite is
  // server-side and invisible to the browser's URL bar, so a relative
  // fetch from "/flood" resolves against "/", not this folder.
  function levelsBaseUrl() {
    const p = location.pathname;
    if (p.endsWith(".html") || p.endsWith("/prototype") || p === "/") return "levels/";
    return "/prototypes/flood-mobile-concept/levels/";
  }

  // Loads the real, hand-picked level set (7 tutorials + 50 generated) from
  // levels/index.json via fetch(). This is what actually ships — the random
  // generator above is only a fallback for when fetch can't reach the level
  // files at all (typically: opened as a local file:// page, where browsers
  // block fetch() between sibling files).
  async function buildCuratedStarterPack() {
    const base = levelsBaseUrl();
    const res = await fetch(base + "index.json");
    if (!res.ok) throw new Error("index.json fetch failed: " + res.status);
    const manifest = await res.json();
    if (!Array.isArray(manifest) || manifest.length === 0) throw new Error("empty/invalid manifest");
    return Promise.all(manifest.map(async (entry) => {
      const r = await fetch(base + entry.file);
      if (!r.ok) throw new Error("level fetch failed: " + entry.file);
      const cfg = await r.json();
      return validateConfig(cfg); // fills in defaults for any optional/missing fields
    }));
  }

  async function buildStarterPack() {
    try {
      return await buildCuratedStarterPack();
    } catch (err) {
      console.warn(
        "Không tải được bộ level từ levels/ (bình thường khi mở file này trực tiếp — " +
        "trình duyệt chặn fetch() giữa các file cục bộ). Dùng bộ ngẫu nhiên thay thế.",
        err
      );
      return buildRandomStarterPack(STARTER_PACK_SIZE);
    }
  }

  // Rebuilds the piece -> cells lookup, used for hidden-reveal checks and
  // the ice-countdown array (one entry per piece).
  function buildPieceIndex() {
    const count = cellPieceId.reduce((m, v) => Math.max(m, v), -1) + 1;
    pieceCells = new Array(count);
    for (let p = 0; p < count; p++) pieceCells[p] = [];
    for (let i = 0; i < cellPieceId.length; i++) pieceCells[cellPieceId[i]].push(i);
  }

  function isPieceFrozen(p) {
    return (iceRemaining[p] || 0) > 0;
  }

  // Hidden pieces conceal their real color until the captured territory
  // touches (or contains) any of their cells. Since `filled` only ever
  // grows during a playthrough, "touched at any point" == "touched now",
  // so this can be recomputed fresh each render with no extra state.
  function computeConcealedHiddenPieces() {
    const concealed = new Set();
    for (let p = 0; p < pieceMechanics.length; p++) {
      if (!pieceMechanics[p] || pieceMechanics[p].type !== "hidden") continue;
      const touched = pieceCells[p].some(c => filled.has(c) || neighborsOf(c).some(n => filled.has(n)));
      if (!touched) concealed.add(p);
    }
    return concealed;
  }

  // Frozen ice pieces are impassable to the flood fill regardless of color
  // match — they only ever join the territory once thawed.
  function bfsRegion(startIdx, color) {
    const seen = new Set([startIdx]);
    const queue = [startIdx];
    while (queue.length) {
      const cur = queue.pop();
      for (const ni of neighborsOf(cur)) {
        if (seen.has(ni)) continue;
        if (isPieceFrozen(cellPieceId[ni])) continue;
        if (grid[ni] === color) {
          seen.add(ni);
          queue.push(ni);
        }
      }
    }
    return seen;
  }

  function isSolved() {
    const c = grid[startIndex];
    for (let i = 0; i < grid.length; i++) {
      if (grid[i] !== c) return false;
    }
    return true;
  }

  function buildBoardDom() {
    boardEl.innerHTML = "";
    cellEls = [];
    bridgeEls = [];
    for (let i = 0; i < W * H; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const glyph = document.createElement("div");
      glyph.className = "glyph";
      cell.appendChild(glyph);
      boardEl.appendChild(cell);
      cellEls.push(cell);
    }
    // Appended last so it paints above the cells — it redraws the captured
    // region on top of them and carries the outline filter.
    territoryLayer = document.createElement("div");
    territoryLayer.id = "territoryLayer";
    boardEl.appendChild(territoryLayer);
    layoutBoard();
  }

  // Computes an exact integer pixel size per cell from the wrapper's actual
  // width AND height (accounting for the CSS gap between cells), then sets
  // the board's pixel width/height and grid track sizes directly in px.
  // Capping by height too (not just width) is what keeps the controls below
  // the board (palette, Chơi lại/Next) on-screen without scrolling on real
  // devices — #boardWrap is a flexible child that only gets the vertical
  // space left over after the header/hud/palette/buttons take theirs, so a
  // big board (e.g. 8x8) shrinks its cells instead of pushing those
  // controls off the bottom of the viewport. Using exact px (not percentage
  // or aspect-ratio) is also what keeps cells perfectly square — letting
  // the browser derive cell size that way can round each track differently
  // and produce slightly uneven rows/columns. The resulting cellSize is
  // also what renderBoard() uses to position the merge bridges in px.
  function layoutBoard() {
    const wrapWidth = boardWrapEl.clientWidth;
    const wrapHeight = boardWrapEl.clientHeight;
    const innerW = Math.max(1, wrapWidth - BOARD_PADDING * 2 - BOARD_GAP * (W - 1));
    const innerH = Math.max(1, wrapHeight - BOARD_PADDING * 2 - BOARD_GAP * (H - 1));
    const cellSize = Math.max(4, Math.floor(Math.min(innerW / W, innerH / H)));
    currentCellSize = cellSize;
    const pixelW = cellSize * W + BOARD_GAP * (W - 1) + BOARD_PADDING * 2;
    const pixelH = cellSize * H + BOARD_GAP * (H - 1) + BOARD_PADDING * 2;
    boardEl.style.width = pixelW + "px";
    boardEl.style.height = pixelH + "px";
    boardEl.style.gridTemplateColumns = `repeat(${W}, ${cellSize}px)`;
    boardEl.style.gridTemplateRows = `repeat(${H}, ${cellSize}px)`;
  }

  // Visual "group" a cell belongs to for merging purposes: every captured
  // cell shares one group ("F") regardless of its original piece, so the
  // whole territory reads as one blob; an uncaptured cell's group is its
  // own piece id, so a piece's own cells merge into their designed shape.
  function groupOf(i) {
    return filled.has(i) ? "F" : cellPieceId[i];
  }

  function addBridge(parent, left, top, w, h, color, frozen) {
    const b = document.createElement("div");
    b.className = "bridge" + (frozen ? " frozen" : "");
    b.style.left = left + "px";
    b.style.top = top + "px";
    b.style.width = w + "px";
    b.style.height = h + "px";
    b.style.background = color;
    parent.appendChild(b);
    if (parent === boardEl) bridgeEls.push(b);
  }

  // Redraws one captured cell onto the territory overlay at the same place
  // and shape as the real cell, so the overlay's union matches the region
  // exactly and the outline filter traces its true perimeter.
  function addTerritoryCell(left, top, size, radius, color) {
    const t = document.createElement("div");
    t.className = "tshape";
    t.style.left = left + "px";
    t.style.top = top + "px";
    t.style.width = size + "px";
    t.style.height = size + "px";
    t.style.borderRadius = radius;
    t.style.background = color;
    territoryLayer.appendChild(t);
  }

  // Renders cells and, for every pair of same-group orthogonal neighbors,
  // a small filler rectangle bridging the CSS grid gap between them so the
  // group reads as one seamless rounded shape. Each cell's own corner
  // radii are individually flattened wherever that corner sits strictly
  // inside the group (both orthogonal neighbors AND the diagonal neighbor
  // at that corner are same-group) and left rounded everywhere else — so
  // only the group's true outer boundary looks rounded, matching how a
  // single rounded shape would look if drawn as one piece.
  function renderBoard() {
    const concealed = computeConcealedHiddenPieces();
    const size = currentCellSize;

    bridgeEls.forEach(el => el.remove());
    bridgeEls = [];
    territoryLayer.innerHTML = "";

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        const cell = cellEls[i];
        const glyph = cell.firstChild;
        const p = cellPieceId[i];
        const mech = pieceMechanics[p] || { type: "normal" };
        const isConcealed = concealed.has(p);
        const isFrozen = mech.type === "ice" && isPieceFrozen(p);
        const isFilled = filled.has(i);
        const color = isConcealed ? "var(--hidden-bg)" : COLORS[grid[i]];

        cell.style.background = color;
        cell.classList.toggle("frozen", isFrozen);

        // Marks repeat on every cell of a piece rather than once at its
        // centre, so the whole block reads as "hidden"/"frozen" at a glance
        // no matter which part of it you look at.
        if (isConcealed) glyph.textContent = "?";
        else if (isFrozen) glyph.textContent = String(iceRemaining[p]);
        else if (i === startIndex) glyph.textContent = "★";
        else glyph.textContent = "";

        const g = groupOf(i);
        const topI = y > 0 ? idx(x, y - 1) : null;
        const bottomI = y < H - 1 ? idx(x, y + 1) : null;
        const leftI = x > 0 ? idx(x - 1, y) : null;
        const rightI = x < W - 1 ? idx(x + 1, y) : null;
        const tlI = (x > 0 && y > 0) ? idx(x - 1, y - 1) : null;
        const trI = (x < W - 1 && y > 0) ? idx(x + 1, y - 1) : null;
        const blI = (x > 0 && y < H - 1) ? idx(x - 1, y + 1) : null;
        const brI = (x < W - 1 && y < H - 1) ? idx(x + 1, y + 1) : null;

        const sameTop = topI !== null && groupOf(topI) === g;
        const sameBottom = bottomI !== null && groupOf(bottomI) === g;
        const sameLeft = leftI !== null && groupOf(leftI) === g;
        const sameRight = rightI !== null && groupOf(rightI) === g;
        const sameTL = tlI !== null && groupOf(tlI) === g;
        const sameTR = trI !== null && groupOf(trI) === g;
        const sameBL = blI !== null && groupOf(blI) === g;
        const sameBR = brI !== null && groupOf(brI) === g;

        const flatTL = sameTop && sameLeft && sameTL;
        const flatTR = sameTop && sameRight && sameTR;
        const flatBR = sameBottom && sameRight && sameBR;
        const flatBL = sameBottom && sameLeft && sameBL;

        const radius =
          (flatTL ? 0 : CELL_RADIUS) + "px " +
          (flatTR ? 0 : CELL_RADIUS) + "px " +
          (flatBR ? 0 : CELL_RADIUS) + "px " +
          (flatBL ? 0 : CELL_RADIUS) + "px";
        cell.style.borderRadius = radius;

        // No per-cell white border any more — the captured region's white
        // line is drawn as one continuous outline around the whole region
        // by #territoryLayer's filter (see CSS), which is what makes it
        // wrap the region completely instead of breaking at every gap.
        cell.style.borderWidth = "0";

        // Absolute coordinates are relative to #board's PADDING box, so the
        // board's own padding has to be added — cell (0,0) starts at
        // BOARD_PADDING, not 0. Without this every bridge landed one
        // padding-width up and to the left, i.e. inside the cell instead of
        // in the gap, which is why merged blocks never actually looked
        // joined.
        const cellLeftPx = BOARD_PADDING + x * (size + BOARD_GAP);
        const cellTopPx = BOARD_PADDING + y * (size + BOARD_GAP);

        if (isFilled) {
          addTerritoryCell(cellLeftPx, cellTopPx, size, radius, color);
        }
        const bridgeParent = isFilled ? territoryLayer : boardEl;

        // Bridges must stop exactly where the cell's own rounded corner
        // starts curving (CELL_RADIUS from that corner) — a bridge that
        // runs the full edge length regardless of corner rounding doesn't
        // line up with the curve there, which is what made joints look
        // rough/notched. Only inset to 0 when that corner is flat (fully
        // interior to the group), matching where the straight edge really
        // begins.
        if (sameRight) {
          const topInset = flatTR ? 0 : CELL_RADIUS;
          const bottomInset = flatBR ? 0 : CELL_RADIUS;
          const h = Math.max(0, size - topInset - bottomInset);
          addBridge(bridgeParent, cellLeftPx + size, cellTopPx + topInset, BOARD_GAP, h, color, isFrozen);
        }
        if (sameBottom) {
          const leftInset = flatBL ? 0 : CELL_RADIUS;
          const rightInset = flatBR ? 0 : CELL_RADIUS;
          const w = Math.max(0, size - leftInset - rightInset);
          addBridge(bridgeParent, cellLeftPx + leftInset, cellTopPx + size, w, BOARD_GAP, color, isFrozen);
        }
      }
    }
  }

  // Colors of pieces that touch the captured territory but aren't part of
  // it yet — i.e. colors that would actually grow your territory this turn.
  // Frozen ice pieces are excluded even if adjacent and color-matching,
  // since picking that color still couldn't capture them this turn.
  function frontierColors() {
    const set = new Set();
    filled.forEach(i => {
      for (const n of neighborsOf(i)) {
        if (filled.has(n)) continue;
        if (isPieceFrozen(cellPieceId[n])) continue;
        set.add(grid[n]);
      }
    });
    return set;
  }

  function renderPalette() {
    const frontier = frontierColors();
    // Only show colors this level actually paints somewhere — a level with
    // 2 colors used to still show all 5 palette slots, with the unused
    // ones sitting there permanently dimmed for no reason. `grid` mutates
    // as you play but its values are always drawn from the level's
    // original per-piece colors, so that's the source of truth for "which
    // colors exist here" regardless of how far the game has progressed.
    const usedColors = new Set(originalPieceColors);
    paletteEl.innerHTML = "";
    paletteEl.style.gridTemplateColumns = `repeat(${usedColors.size}, 1fr)`;
    COLORS.forEach((c, i) => {
      if (!usedColors.has(i)) return;
      const btn = document.createElement("button");
      const isCurrent = i === currentColor;
      const isUseless = !isCurrent && !frontier.has(i);
      btn.className = "swatch" + (isCurrent ? " current" : "") + (isUseless ? " dimmed" : "");
      btn.style.background = c;
      // Dimmed = would not grow the territory this turn — genuinely
      // disabled, not just visually discouraged, so the button never
      // silently wastes a move.
      btn.disabled = isUseless;
      btn.addEventListener("click", () => onPickColor(i));
      paletteEl.appendChild(btn);
    });
  }

  function renderHud() {
    movesLeftEl.textContent = `${movesLeft} / ${MAX_MOVES}`;
    levelNumLabelEl.textContent = `${packIndex + 1}/${pack.length}`;
  }

  function showOverlay(won) {
    overlay.classList.add("show");
    overlayTitle.textContent = won ? "Thắng rồi! 🎉" : "Hết lượt rồi";
    overlayTitle.className = won ? "win" : "lose";
    overlayDetail.textContent = won
      ? `Bạn phủ kín lưới trong ${MAX_MOVES - movesLeft} lượt.`
      : "Lưới chưa phủ kín một màu. Thử lại nhé.";
    // Winning is the only path that offers to jump straight to the next
    // level — losing should only offer a retry. There's no persistent
    // Next/Back control elsewhere in the UI (see retryIconBtn), so this is
    // the only way to advance.
    const hasNext = packIndex < pack.length - 1;
    overlayNextBtn.classList.toggle("hidden", !(won && hasNext));
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function onPickColor(colorIndex) {
    if (gameOver) return;
    if (colorIndex === currentColor) return; // no-op tap, no move spent
    if (!frontierColors().has(colorIndex)) return; // disabled — would not grow territory, no move spent

    // Ice pieces thaw as moves pass. Decrement first so a piece that hits 0
    // this move is already capturable by this same move's flood-fill.
    for (let p = 0; p < iceRemaining.length; p++) {
      if (iceRemaining[p] > 0) iceRemaining[p]--;
    }

    grid.forEach((_, i) => {
      if (filled.has(i)) grid[i] = colorIndex;
    });
    currentColor = colorIndex;
    filled = bfsRegion(startIndex, colorIndex);
    movesLeft--;

    renderBoard();
    renderPalette();
    renderHud();

    if (isSolved()) {
      gameOver = true;
      showOverlay(true);
      return;
    }
    if (movesLeft <= 0) {
      gameOver = true;
      showOverlay(false);
    }
  }

  // Resets colors/moves back to the level's starting state without
  // reshuffling piece shapes — "retry the same puzzle".
  function resetCurrentBoard() {
    buildPieceIndex();
    grid = cellPieceId.map(pid => originalPieceColors[pid]);
    iceRemaining = pieceCells.map((_, p) => {
      const mech = pieceMechanics[p];
      return mech && mech.type === "ice" ? Math.max(0, mech.turns | 0) : 0;
    });
    currentColor = grid[startIndex];
    filled = bfsRegion(startIndex, currentColor);
    movesLeft = MAX_MOVES;
    gameOver = false;
    hideOverlay();
    buildBoardDom();
    renderBoard();
    renderPalette();
    renderHud();
  }

  function loadPackLevel(i) {
    const lvl = pack[i];
    packIndex = i;
    W = lvl.w;
    H = lvl.h;
    COLORS = lvl.colors.slice();
    MAX_MOVES = lvl.maxMoves;
    startIndex = lvl.startIndex;
    cellPieceId = lvl.pieceMap;
    originalPieceColors = lvl.pieceColors;
    pieceMechanics = lvl.pieceMechanics || lvl.pieceColors.map(() => ({ type: "normal" }));
    levelName = lvl.name;
    resetCurrentBoard();
    showLevelIntroIfAny(i);
  }

  function validateConfig(cfg) {
    if (!cfg || typeof cfg !== "object") throw new Error("Config rỗng hoặc sai định dạng");
    const w = Number.isInteger(cfg.gridWidth) ? cfg.gridWidth : cfg.gridSize;
    const h = Number.isInteger(cfg.gridHeight) ? cfg.gridHeight : cfg.gridSize;
    if (!Number.isInteger(w) || w < 2 || w > 24) throw new Error("gridWidth phải là số nguyên 2-24");
    if (!Number.isInteger(h) || h < 2 || h > 24) throw new Error("gridHeight phải là số nguyên 2-24");
    if (!Array.isArray(cfg.pieceMap) || cfg.pieceMap.length !== w * h) {
      throw new Error(`pieceMap phải có đúng ${w * h} phần tử`);
    }
    if (!Array.isArray(cfg.pieceColors) || cfg.pieceColors.length === 0) {
      throw new Error("thiếu pieceColors");
    }
    const colors = Array.isArray(cfg.colors) && cfg.colors.length > 0 ? cfg.colors.slice() : DEFAULT_COLORS.slice();
    const maxPieceId = cfg.pieceMap.reduce((m, v) => Math.max(m, v), -1);
    if (maxPieceId >= cfg.pieceColors.length) {
      throw new Error("pieceMap tham chiếu piece id vượt quá độ dài pieceColors");
    }
    for (const c of cfg.pieceColors) {
      if (!Number.isInteger(c) || c < 0 || c >= colors.length) {
        throw new Error("pieceColors có giá trị màu không hợp lệ");
      }
    }
    const pieceCount = cfg.pieceColors.length;
    let mechanics;
    if (Array.isArray(cfg.pieceMechanics)) {
      mechanics = new Array(pieceCount);
      for (let p = 0; p < pieceCount; p++) {
        const m = cfg.pieceMechanics[p];
        if (!m || typeof m !== "object" || !["normal", "hidden", "ice"].includes(m.type)) {
          mechanics[p] = { type: "normal" };
        } else if (m.type === "ice") {
          mechanics[p] = { type: "ice", turns: Number.isInteger(m.turns) && m.turns > 0 ? m.turns : 3 };
        } else {
          mechanics[p] = { type: m.type };
        }
      }
    } else {
      mechanics = new Array(pieceCount).fill(null).map(() => ({ type: "normal" }));
    }
    const maxMoves = Number.isInteger(cfg.maxMoves) && cfg.maxMoves > 0 ? cfg.maxMoves : DEFAULT_MAX_MOVES;
    const name = typeof cfg.name === "string" && cfg.name.trim() ? cfg.name.trim() : "Level JSON";
    const total = w * h;
    const start = Number.isInteger(cfg.startIndex) && cfg.startIndex >= 0 && cfg.startIndex < total ? cfg.startIndex : 0;
    return {
      w, h,
      pieceMap: cfg.pieceMap.slice(),
      pieceColors: cfg.pieceColors.slice(),
      pieceMechanics: mechanics,
      colors,
      maxMoves,
      name,
      startIndex: start
    };
  }

  retryIconBtn.addEventListener("click", resetCurrentBoard);
  overlayBtn.addEventListener("click", resetCurrentBoard);
  overlayNextBtn.addEventListener("click", () => {
    if (packIndex < pack.length - 1) loadPackLevel(packIndex + 1);
  });

  let resizePending = false;
  window.addEventListener("resize", () => {
    if (resizePending) return;
    resizePending = true;
    requestAnimationFrame(() => {
      resizePending = false;
      layoutBoard();
      renderBoard(); // cellSize may have changed — bridges need repositioning
    });
  });

  levelNumLabelEl.textContent = "…";
  (async () => {
    pack = await buildStarterPack();
    loadPackLevel(0);
  })();
})();
</script>

</body>
</html>
