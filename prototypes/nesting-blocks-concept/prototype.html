<!-- PROTOTYPE - NOT FOR PRODUCTION
     Question: Does color-tiered nesting (drag smaller blocks into a bigger
     container, Russian-doll style, with "skip-tier" packing allowed) feel
     satisfying and clear?
     Date: 2026-08-12

     MODEL: shape-accurate collision. A piece occupies and contains space
     according to its ACTUAL drawn shape (circle = circle, triangle =
     triangle), computed with SAT (separating axis theorem). This is the
     whole puzzle: a circle wastes its bounding box's corners, a triangle
     wastes even more, so shape choice is a real spatial trade-off, not a
     cosmetic one. Round 6 briefly made every shape use its bounding box for
     capacity ("one shared box") -- that was a misreading of feedback and
     has been reverted; do not reintroduce it without being explicitly asked.

     Portrait mobile-web layout: the SVG user space is a fixed 1080x1780 and
     scales to whatever screen it lands on.
-->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nesting Blocks Prototype</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #1e1e24;
    color: #eee;
    display: flex;
    flex-direction: column;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  header, footer { flex: none; padding: 6px 10px; }
  h1 { font-size: 16px; margin: 0; }
  p.hint { color: #999; margin: 2px 0 0; font-size: 12px; line-height: 1.3; }
  #levelLabel { font-size: 13px; color: #ffb347; margin-top: 3px; }

  /* The stage owns whatever height is left after header/footer; the SVG is
     absolutely positioned inside it so it can never push the layout taller
     than the viewport (which was clipping the bottom of the tray). */
  #stage { flex: 1 1 0; min-height: 0; position: relative; }
  svg#world {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;   /* pointer events only -- no scroll/zoom hijack */
  }

  .piece { cursor: grab; }
  .piece.dragging { cursor: grabbing; }
  .piece.settling { transition: transform 90ms ease-out; }

  /* The shape itself is the hitbox -- no separate box drawn around it. */
  .shape { stroke: transparent; stroke-width: 4; }
  .piece.resolved .shape { stroke: rgba(255,255,255,0.4); }
  .piece.valid   .shape { stroke: #4ade80 !important; stroke-width: 6; }
  .piece.invalid .shape { stroke: #ef4444 !important; stroke-width: 6; }

  .hitbox { fill: none; stroke: #ff00ff; stroke-width: 3; stroke-dasharray: 10 8; display: none; pointer-events: none; }
  body.show-hitbox .hitbox { display: block; }

  /* Rotate mode is entered by holding a piece still (long-press), not by
     grabbing a small target -- this flashes on the instant it arms so a
     touch has some feedback before the finger starts tracing the angle. */
  .piece.rotate-armed .shape { stroke: #ffe27a !important; stroke-width: 6; }

  #guide { fill: none; stroke: rgba(255,255,255,0.6); stroke-width: 4; stroke-dasharray: 12 10; pointer-events: none; }

  #status { font-size: 15px; min-height: 20px; color: #eee; }
  #status.win { color: #4ade80; font-weight: bold; }

  .btnrow { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  button {
    min-height: 44px; padding: 0 18px; font-size: 15px;
    background: #333; color: #eee;
    border: 1px solid #555; border-radius: 8px;
    cursor: pointer;
  }
  #nextLevelBtn { display: none; background: #4ade80; color: #10321f; font-weight: bold; border: none; }
  label.toggle { font-size: 13px; color: #999; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
  label.toggle input { width: 20px; height: 20px; }
</style>
</head>
<body>

<header>
  <h1>Nesting Blocks — Concept Prototype</h1>
  <p class="hint">Giu yen mot cho tren khoi xanh la (khong di chuyen) de vao che do xoay, roi ve vong cung de xoay tu do. Keo binh thuong de di chuyen / long vao khoi xanh duong / xep vao khung cam.</p>
  <div id="levelLabel"></div>
</header>

<div id="stage">
  <svg id="world" viewBox="0 0 1080 1780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <rect id="boardStroke" fill="rgba(255,140,0,0.06)" stroke="#ff8c00" stroke-width="8" rx="10"/>
    <text id="trayLabel" fill="#888" font-size="30" font-family="system-ui, sans-serif">Khay khoi — lap ghep duoc ngay tai day</text>
    <g id="lyBlue"></g>
    <g id="guideLayer"></g>
    <g id="lyGreen"></g>
  </svg>
</div>

<footer>
  <div id="status"></div>
  <div class="btnrow">
    <button id="resetBtn">Reset</button>
    <button id="nextLevelBtn">Level tiep &rarr;</button>
    <label class="toggle"><input type="checkbox" id="hitboxToggle"> Hien hitbox</label>
  </div>
</footer>

<script>
// ---------------------------------------------------------------------------
// Constants -- SVG user space is a fixed 1080x1920 portrait canvas.
// ---------------------------------------------------------------------------
// Canvas height is sized so the tallest level (3 tray rows of greens + the
// blue row) fits without spilling past the bottom edge. Board 640 = 4 greens
// across = 2 blues across, so everything divides cleanly.
const CANVAS_W = 1080, CANVAS_H = 1780;

const GREEN = 160;
const BLUE  = 320;
const BOARD = 640;
const BOARD_X = (CANVAS_W - BOARD) / 2;   // 220
const BOARD_Y = 40;

// Divides every size in play (160 / 320 / 640), so every flush-packed
// position is still exactly reachable. Kept small for a smooth, near-free
// drag feel -- snapping only ever happens at drop (see onPointerUp), never
// during the drag itself, so this number affects placement precision only,
// not how choppy the piece looks while moving.
const GRID = 10;

const EPS = 0.5;          // boxes may touch; only real penetration collides
const BOARD_KEEPOUT = 20; // parked pieces must clear the board's outer stroke

// ---------------------------------------------------------------------------
// Level format -- this is the level-design surface. Each level is:
//   { name, blues: [shape, shape], greens: [{shape, count}, ...] }
//
// Structural rule (not a level-design choice): exactly 2 blue containers.
// The board is exactly 2*BLUE wide, and the tray/board layout in
// buildLevel() places them side by side spanning it -- a different count
// needs a layout change, not just a data change. Everything else is free:
// which shape each blue is, and the green shape mix/total.
//
// Capacity budget at the current scale (GREEN=160, BLUE=320, BOARD=640),
// so a new level can be sized without guessing:
//   - board strip (below the 2 blues): exactly 8 greens (4 cols x 2 rows)
//   - a SQUARE container: exactly 4 greens (zero-slack 2x2 tiling)
//   - a CIRCLE container: exactly 1 centred green (2 side by side does not
//     fit the radius at this GREEN:BLUE ratio -- see round 8's README notes)
//   - a TRIANGLE container: not pre-computed -- shapeContains() handles it
//     correctly, but no known-good slot layout exists for it here. A level
//     using one must be checked by hand (DBG console) before shipping.
// So max total greens = 8 (strip) + (4 or 1 per blue, by its shape).
// Two squares -> up to 16. One square + one circle -> up to 13. Two circles
// -> up to 10. ALWAYS VERIFY with `DBG.level = i; DBG.autoSolve().won`
// after adding or editing a level -- see README "Adding a level".
// ---------------------------------------------------------------------------
const LEVELS = [
  {
    name: 'Level 1',
    blues: ['square', 'circle'],
    greens: [ { shape: 'square', count: 3 }, { shape: 'circle', count: 3 }, { shape: 'triangle', count: 2 } ],
  },
  {
    name: 'Level 2',
    blues: ['square', 'circle'],
    greens: [ { shape: 'square', count: 4 }, { shape: 'circle', count: 4 }, { shape: 'triangle', count: 4 } ],
  },
  {
    name: 'Level 3',
    blues: ['square', 'square'],   // two square containers -> 8 nestable, not 5
    greens: [ { shape: 'square', count: 6 }, { shape: 'circle', count: 5 }, { shape: 'triangle', count: 5 } ],
  },
];

// ---------------------------------------------------------------------------
// Geometry
//
// geomOf() is the single place that decides what a piece occupies and what
// it can hold -- shape-accurate, computed from the same path used to draw
// it. Everything downstream (SAT overlap, containment, drop targeting)
// reads only through geomOf()/worldGeom(), so this one function is the
// entire collision model.
// ---------------------------------------------------------------------------
function motifPath(shape, size) {
  if (shape === 'triangle') return [[size/2, 0], [size, size], [0, size]];
  return [[0,0], [size,0], [size,size], [0,size]];
}

function rectGeom(x, y, w, h) {
  return { kind: 'poly', pts: [[x,y],[x+w,y],[x+w,y+h],[x,y+h]] };
}

function rotatePt(px, py, cx, cy, deg) {
  if (!deg) return [px, py];
  const rad = deg * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
  const dx = px - cx, dy = py - cy;
  return [cx + dx*cos - dy*sin, cy + dx*sin + dy*cos];
}

// A piece's own rotation is always relative to its PARENT's unrotated local
// frame (or to world space, for a top-level piece). Its EFFECTIVE rotation
// -- what actually gets drawn/collided -- also carries every ancestor's
// rotation, so a container spinning visibly spins its contents with it.
// Nesting in this game is exactly one level deep (green -> blue), but this
// is written recursively so it stays correct if that ever changes.
function effectiveRotation(piece) {
  const own = piece.rotation || 0;
  return piece.parent ? own + effectiveRotation(piece.parent) : own;
}

// The real shape: a circle collides/contains as a circle, a triangle as a
// triangle. This is what makes shape choice matter for packing. Rotation is
// free-angle around the piece's own centre -- a circle is unaffected by
// definition, a square becomes a diamond off-axis, a triangle genuinely
// changes footprint (this is the point: two triangles can interlock).
function geomOf(piece, x, y) {
  if (piece.shape === 'circle') {
    return { kind: 'circle', cx: x + piece.size/2, cy: y + piece.size/2, r: piece.size/2 };
  }
  const c = piece.size / 2, rot = effectiveRotation(piece);
  const pts = motifPath(piece.shape, piece.size).map(([px, py]) => {
    const [rx, ry] = rotatePt(px, py, c, c, rot);
    return [rx + x, ry + y];
  });
  return { kind: 'poly', pts };
}

function edgeNormals(pts) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    const ex = b[0]-a[0], ey = b[1]-a[1];
    const len = Math.hypot(ex, ey);
    if (len < 1e-9) continue;
    out.push({ x: -ey/len, y: ex/len });
  }
  return out;
}

function nearestVertexAxis(circle, pts) {
  let bx = 0, by = 0, best = Infinity;
  for (const p of pts) {
    const dx = p[0]-circle.cx, dy = p[1]-circle.cy;
    const d = dx*dx + dy*dy;
    if (d < best) { best = d; bx = dx; by = dy; }
  }
  const len = Math.hypot(bx, by);
  return len < 1e-9 ? null : { x: bx/len, y: by/len };
}

function project(shape, ax) {
  if (shape.kind === 'circle') {
    const c = shape.cx*ax.x + shape.cy*ax.y;
    return { min: c - shape.r, max: c + shape.r };
  }
  let min = Infinity, max = -Infinity;
  for (const p of shape.pts) {
    const v = p[0]*ax.x + p[1]*ax.y;
    if (v < min) min = v;
    if (v > max) max = v;
  }
  return { min, max };
}

// True only on genuine penetration; touching (overlap <= EPS) is allowed.
function shapesOverlap(a, b) {
  const axes = [];
  if (a.kind === 'poly') axes.push(...edgeNormals(a.pts));
  if (b.kind === 'poly') axes.push(...edgeNormals(b.pts));
  if (a.kind === 'circle' && b.kind === 'poly') { const ax = nearestVertexAxis(a, b.pts); if (ax) axes.push(ax); }
  if (b.kind === 'circle' && a.kind === 'poly') { const ax = nearestVertexAxis(b, a.pts); if (ax) axes.push(ax); }
  if (a.kind === 'circle' && b.kind === 'circle') {
    const dx = b.cx-a.cx, dy = b.cy-a.cy, len = Math.hypot(dx, dy);
    if (len < 1e-9) return true;
    axes.push({ x: dx/len, y: dy/len });
  }
  for (const ax of axes) {
    const pa = project(a, ax), pb = project(b, ax);
    if (Math.min(pa.max, pb.max) - Math.max(pa.min, pb.min) <= EPS) return false;
  }
  return true;
}

function edgePlanes(pts) {
  const cx = pts.reduce((s,p) => s+p[0], 0) / pts.length;
  const cy = pts.reduce((s,p) => s+p[1], 0) / pts.length;
  const planes = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    const ex = b[0]-a[0], ey = b[1]-a[1];
    const len = Math.hypot(ex, ey);
    if (len < 1e-9) continue;
    let n = { x: -ey/len, y: ex/len };
    let d = n.x*a[0] + n.y*a[1];
    if (n.x*cx + n.y*cy > d) { n = { x: -n.x, y: -n.y }; d = -d; }
    planes.push({ n, d });
  }
  return planes;
}

function shapeContains(container, inner) {
  const tol = 1e-6;
  if (container.kind === 'poly') {
    for (const { n, d } of edgePlanes(container.pts)) {
      if (inner.kind === 'poly') {
        for (const p of inner.pts) if (n.x*p[0] + n.y*p[1] > d + tol) return false;
      } else {
        if (n.x*inner.cx + n.y*inner.cy + inner.r > d + tol) return false;
      }
    }
    return true;
  }
  if (inner.kind === 'poly') {
    for (const p of inner.pts) {
      if (Math.hypot(p[0]-container.cx, p[1]-container.cy) > container.r + tol) return false;
    }
    return true;
  }
  return Math.hypot(inner.cx-container.cx, inner.cy-container.cy) + inner.r <= container.r + tol;
}

function pointInShape(shape, px, py) {
  if (shape.kind === 'circle') return Math.hypot(px-shape.cx, py-shape.cy) <= shape.r;
  for (const { n, d } of edgePlanes(shape.pts)) if (n.x*px + n.y*py > d + 1e-6) return false;
  return true;
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const svg = document.getElementById('world');
const lyBlue = document.getElementById('lyBlue');
const lyGreen = document.getElementById('lyGreen');
const guideLayer = document.getElementById('guideLayer');
const statusEl = document.getElementById('status');
const levelLabelEl = document.getElementById('levelLabel');
const nextLevelBtn = document.getElementById('nextLevelBtn');

let pieces = [];
let currentLevel = 0;
let drag = null;

const boardGeom = () => rectGeom(BOARD_X, BOARD_Y, BOARD, BOARD);
const boardKeepOut = () => rectGeom(
  BOARD_X - BOARD_KEEPOUT, BOARD_Y - BOARD_KEEPOUT,
  BOARD + BOARD_KEEPOUT*2, BOARD + BOARD_KEEPOUT*2);

// localX/localY are stored in the parent's OWN unrotated frame (same frame
// motifPath/geomOf use for the parent at rotation 0) -- so a child's world
// position has to be rotated by the parent's CURRENT rotation, around the
// parent's centre, before adding the parent's world offset. This is what
// makes rotating a container carry its contents around with it instead of
// leaving them stranded at their pre-rotation spot.
function worldPos(p) {
  if (!p.parent) return { x: p.x, y: p.y };
  const w = worldPos(p.parent);
  const rot = p.parent.rotation || 0;
  if (!rot) return { x: w.x + p.localX, y: w.y + p.localY };
  const c = p.parent.size / 2;
  const [rx, ry] = rotatePt(p.localX, p.localY, c, c, rot);
  return { x: w.x + rx, y: w.y + ry };
}
function worldGeom(p) {
  const w = worldPos(p);
  return geomOf(p, w.x, w.y);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const SVG_NS = 'http://www.w3.org/2000/svg';

// Builds the actual shape node (circle or polygon) -- used for both the
// visible fill and the debug hitbox overlay, so they can never disagree.
function shapeNode(piece, cls) {
  let n;
  if (piece.shape === 'circle') {
    n = document.createElementNS(SVG_NS, 'circle');
    n.setAttribute('cx', piece.size/2);
    n.setAttribute('cy', piece.size/2);
    n.setAttribute('r', piece.size/2);
  } else {
    n = document.createElementNS(SVG_NS, 'polygon');
    n.setAttribute('points', motifPath(piece.shape, piece.size).map(p => p.join(',')).join(' '));
  }
  n.setAttribute('class', cls);
  return n;
}

function makePiece(color, shape, x, y) {
  const size = color === 'blue' ? BLUE : GREEN;
  const solid = color === 'blue' ? '#60a5fa' : '#34d399';
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', 'piece');

  const piece = {
    el: g, color, shape, size,
    x, y, homeX: x, homeY: y, rotation: 0,
    onBoard: false, parent: null, localX: 0, localY: 0,
    children: color === 'blue' ? [] : null
  };

  const fill = shapeNode(piece, 'shape');
  fill.setAttribute('fill', solid);
  g.appendChild(fill);
  g.appendChild(shapeNode(piece, 'hitbox')); // debug overlay -- same path as the fill

  (color === 'blue' ? lyBlue : lyGreen).appendChild(g);
  g.addEventListener('pointerdown', (e) => onPointerDown(e, piece));

  pieces.push(piece);
  render(piece);
  return piece;
}

function render(p) {
  const w = worldPos(p);
  const c = p.size / 2;
  const rot = effectiveRotation(p); // own rotation PLUS every ancestor's
  // Same order as geomOf: rotate around the local centre, then translate --
  // so the drawn shape and the collision shape never disagree.
  const t = rot
    ? `translate(${w.x} ${w.y}) rotate(${rot} ${c} ${c})`
    : `translate(${w.x} ${w.y})`;
  p.el.setAttribute('transform', t);
  p.el.classList.toggle('resolved', isResolved(p));
  if (p.children) p.children.forEach(render);
}
function renderAll() { pieces.filter(p => !p.parent).forEach(render); }

// Outlines the container's TRUE interior (its real shape) while dragging
// over it -- a circle container shows a circle, not its bounding box.
function showGuide(container) {
  guideLayer.textContent = '';
  if (!container) return;
  const w = worldPos(container);
  const n = shapeNode(container, '');
  n.removeAttribute('class');
  n.setAttribute('id', 'guide');
  n.setAttribute('transform', `translate(${w.x} ${w.y})`);
  guideLayer.appendChild(n);
}
function hideGuide() { guideLayer.textContent = ''; }

// ---------------------------------------------------------------------------
// Placement validity
// ---------------------------------------------------------------------------
function collidesWithOthers(piece, g) {
  for (const other of pieces) {
    if (other === piece || other.parent) continue;
    if (shapesOverlap(g, worldGeom(other))) return true;
  }
  return false;
}

function validOnBoard(piece, x, y) {
  const g = geomOf(piece, x, y);
  return shapeContains(boardGeom(), g) && !collidesWithOthers(piece, g);
}

function validInside(piece, container, x, y) {
  const g = geomOf(piece, x, y);
  if (!shapeContains(worldGeom(container), g)) return false;
  for (const child of container.children) {
    if (child === piece) continue;
    if (shapesOverlap(g, worldGeom(child))) return false;
  }
  return true;
}

// Free placement anywhere outside the board, so a whole assembly can be
// built in the tray before being carried in.
function validStaged(piece, x, y) {
  if (x < 0 || y < 0 || x + piece.size > CANVAS_W || y + piece.size > CANVAS_H) return false;
  const g = geomOf(piece, x, y);
  if (shapesOverlap(g, boardKeepOut())) return false;
  return !collidesWithOthers(piece, g);
}

function containerUnder(px, py, exclude) {
  for (const p of pieces) {
    if (p.color !== 'blue' || p === exclude) continue;
    if (pointInShape(worldGeom(p), px, py)) return p;
  }
  return null;
}

function snap(v, origin) { return origin + Math.round((v - origin) / GRID) * GRID; }

// The piece goes exactly where it is aimed (grid-snapped) or nowhere. No
// hunting for a nearby free slot: invalid means it bounces back.
function planDrop(piece, rawX, rawY) {
  const cx = rawX + piece.size/2, cy = rawY + piece.size/2;

  if (piece.color === 'green') {
    const c = containerUnder(cx, cy, piece);
    if (c) {
      const cw = worldPos(c);
      const x = snap(rawX, cw.x), y = snap(rawY, cw.y);
      return validInside(piece, c, x, y)
        ? { kind: 'nest', container: c, x, y }
        : { kind: 'none', container: c };
    }
  }

  if (pointInShape(boardGeom(), cx, cy)) {
    const x = snap(rawX, BOARD_X), y = snap(rawY, BOARD_Y);
    return validOnBoard(piece, x, y) ? { kind: 'board', x, y } : { kind: 'none' };
  }

  const x = snap(rawX, 0), y = snap(rawY, 0);
  return validStaged(piece, x, y) ? { kind: 'stage', x, y } : { kind: 'none' };
}

// ---------------------------------------------------------------------------
// Commit / detach
// ---------------------------------------------------------------------------
function detach(piece) {
  if (!piece.parent) return;
  const w = worldPos(piece);
  const r = effectiveRotation(piece); // resolve to an absolute angle BEFORE
  const sib = piece.parent.children;  // losing the parent that was
  sib.splice(sib.indexOf(piece), 1);  // contributing part of it
  piece.parent = null;
  piece.x = w.x; piece.y = w.y;
  piece.rotation = r;
}

// Converts a world drop position into the container's local (unrotated)
// frame -- the inverse of worldPos()'s rotation, so a later worldPos() call
// reconstructs exactly this same world position for as long as the
// container's rotation doesn't change again, and correctly swings the
// piece if it does. The piece's rotation is stored the same way: relative
// to the container, with the container's current rotation subtracted out.
function nestAtWorld(piece, container, worldX, worldY) {
  const cw = worldPos(container);
  const rot = container.rotation || 0;
  const c = container.size / 2;
  const dx = worldX - cw.x, dy = worldY - cw.y;
  const [lx, ly] = rotatePt(dx, dy, c, c, -rot);
  piece.parent = container;
  piece.localX = lx;
  piece.localY = ly;
  piece.rotation = (((piece.rotation || 0) - rot) % 360 + 360) % 360;
  piece.onBoard = false;
  container.children.push(piece);
}

function commit(piece, plan) {
  if (plan.kind === 'nest') {
    nestAtWorld(piece, plan.container, plan.x, plan.y);
  } else if (plan.kind === 'board') {
    piece.x = plan.x; piece.y = plan.y; piece.onBoard = true;
  } else if (plan.kind === 'stage') {
    piece.x = plan.x; piece.y = plan.y; piece.onBoard = false;
  } else {
    return false;
  }
  render(piece);
  return true;
}

function restore(piece, prev) {
  if (prev && prev.parent) {
    // prev.lx/ly are in the container's LOCAL (unrotated) frame -- rotate
    // back into world space by the container's CURRENT rotation before
    // handing to commit(), which will immediately convert it back to local
    // via nestAtWorld(). Round-trips to the exact original local offset as
    // long as the container hasn't rotated in the meantime; if it has, this
    // correctly re-anchors relative to its new orientation instead.
    const cw = worldPos(prev.parent);
    const rot = prev.parent.rotation || 0;
    const c = prev.parent.size / 2;
    const [wx, wy] = rotatePt(prev.lx, prev.ly, c, c, rot);
    commit(piece, { kind:'nest', container: prev.parent, x: cw.x + wx, y: cw.y + wy });
  } else if (prev) {
    commit(piece, { kind: prev.onBoard ? 'board' : 'stage', x: prev.x, y: prev.y });
  } else {
    commit(piece, { kind:'stage', x: piece.homeX, y: piece.homeY });
  }
}

// ---------------------------------------------------------------------------
// Dragging (pointer events -- mouse and touch alike)
// ---------------------------------------------------------------------------
// getScreenCTM handles whatever scaling/letterboxing the responsive layout
// ends up with, so this is correct on any screen size.
function svgPoint(e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return { x: p.x, y: p.y };
}

// ---------------------------------------------------------------------------
// One gesture, three possible outcomes -- decided by how the finger behaves
// after pointerdown, not by which pixel it landed on (no small target to
// miss on a phone):
//   pending      -- just touched down, waiting to see what happens next
//   moving       -- moved past MOVE_THRESHOLD before the long-press fired
//   rotate-armed -- held still for LONG_PRESS_MS; waiting for the finger to
//                   clear a small dead-zone around the piece's centre so the
//                   very first angle sample isn't numerically unstable
//   rotating     -- tracking the angle from centre to pointer, continuously,
//                   relative to wherever rotation started (not an absolute
//                   "up = 0" reference, since there's no fixed handle
//                   position anymore)
// ---------------------------------------------------------------------------
const MOVE_THRESHOLD = 10;    // client px -- movement that cancels a pending long-press
const LONG_PRESS_MS = 380;    // hold-still time to arm rotate mode
const ROTATE_DEADZONE = 24;   // SVG world px from centre before angle tracking starts

function pieceWorldCenter(piece) {
  const w = worldPos(piece);
  return { x: w.x + piece.size/2, y: w.y + piece.size/2 };
}

function checkRotationValid(piece) {
  const w = worldPos(piece);
  return piece.parent ? validInside(piece, piece.parent, w.x, w.y)
       : piece.onBoard ? validOnBoard(piece, w.x, w.y)
       : validStaged(piece, w.x, w.y);
}

function onPointerDown(e, piece) {
  e.preventDefault();
  const downP = svgPoint(e); // captured NOW, at the actual touch point -- beginMove()
                              // must use this, not wherever the finger is once the
                              // move-threshold is crossed, or the piece jumps on grab
  const timer = setTimeout(() => { if (drag && drag.phase === 'pending') armRotate(); }, LONG_PRESS_MS);
  drag = {
    piece, phase: 'pending', startClientX: e.clientX, startClientY: e.clientY, timer,
    downX: downP.x, downY: downP.y,
    dx: 0, dy: 0, prev: null, plan: null,       // filled in by beginMove()
    rotateBefore: 0, rotateStartAngle: 0, rotateStartRotation: 0, // filled in as rotation starts tracking
  };
  svg.setPointerCapture(e.pointerId);
}

function beginMove() {
  clearTimeout(drag.timer);
  const piece = drag.piece;
  drag.prev = piece.parent
    ? { parent: piece.parent, lx: piece.localX, ly: piece.localY }
    : { x: piece.x, y: piece.y, onBoard: piece.onBoard };
  detach(piece);
  piece.onBoard = false;
  drag.dx = drag.downX - piece.x;
  drag.dy = drag.downY - piece.y;
  drag.phase = 'moving';
  piece.el.classList.remove('settling', 'resolved');
  piece.el.classList.add('dragging');
  piece.el.parentNode.appendChild(piece.el);
}

function armRotate() {
  const piece = drag.piece;
  drag.rotateBefore = piece.rotation;
  drag.phase = 'rotate-armed';
  piece.el.classList.remove('settling', 'resolved');
  piece.el.classList.add('rotate-armed');
  piece.el.parentNode.appendChild(piece.el);
  if (navigator.vibrate) navigator.vibrate(15); // mode-change tick, if the device supports it
}

function onPointerMove(e) {
  if (!drag) return;
  const piece = drag.piece;

  if (drag.phase === 'pending') {
    const dist = Math.hypot(e.clientX - drag.startClientX, e.clientY - drag.startClientY);
    if (dist >= MOVE_THRESHOLD) beginMove();
    else return;
  }

  if (drag.phase === 'moving') {
    const p = svgPoint(e);
    const rawX = p.x - drag.dx, rawY = p.y - drag.dy;
    piece.x = rawX; piece.y = rawY;   // tracks the finger/cursor exactly
    render(piece);

    const plan = planDrop(piece, rawX, rawY);
    drag.plan = plan;
    showGuide(plan.container || (piece.color === 'green'
      ? containerUnder(rawX + piece.size/2, rawY + piece.size/2, piece) : null));

    const ok = plan.kind !== 'none';
    piece.el.classList.toggle('valid', ok);
    piece.el.classList.toggle('invalid', !ok);
    return;
  }

  // rotate-armed or rotating: both need the current angle from centre.
  const c = pieceWorldCenter(piece);
  const p = svgPoint(e);
  const distFromCentre = Math.hypot(p.x - c.x, p.y - c.y);

  if (drag.phase === 'rotate-armed') {
    if (distFromCentre < ROTATE_DEADZONE) return; // too close to centre for a stable angle yet
    drag.rotateStartAngle = Math.atan2(p.y - c.y, p.x - c.x) * 180 / Math.PI;
    drag.rotateStartRotation = piece.rotation;
    drag.phase = 'rotating';
    // fall through so this same move already applies (delta 0 -- no visible jump)
  }

  const theta = Math.atan2(p.y - c.y, p.x - c.x) * 180 / Math.PI;
  const delta = theta - drag.rotateStartAngle;
  piece.rotation = (((drag.rotateStartRotation + delta) % 360) + 360) % 360;
  render(piece);

  const ok = checkRotationValid(piece);
  piece.el.classList.toggle('valid', ok);
  piece.el.classList.toggle('invalid', !ok);
}

function onPointerUp() {
  if (!drag) return;
  clearTimeout(drag.timer);
  const piece = drag.piece;

  if (drag.phase === 'pending') { drag = null; return; } // plain tap, no side effects

  if (drag.phase === 'rotate-armed' || drag.phase === 'rotating') {
    piece.el.classList.remove('valid', 'invalid', 'rotate-armed');
    if (!checkRotationValid(piece)) { piece.rotation = drag.rotateBefore; render(piece); }
    drag = null;
    return;
  }

  // phase === 'moving'
  const plan = drag.plan || planDrop(piece, piece.x, piece.y);
  piece.el.classList.remove('dragging', 'valid', 'invalid');
  piece.el.classList.add('settling');
  hideGuide();

  if (!commit(piece, plan)) restore(piece, drag.prev);

  drag = null;
  renderAll();
  checkWin();
}

function onPointerCancel() {
  if (!drag) return;
  clearTimeout(drag.timer);
  const piece = drag.piece;
  if (drag.phase === 'moving') {
    restore(piece, drag.prev);
    renderAll();
  } else if (drag.phase === 'rotate-armed' || drag.phase === 'rotating') {
    piece.rotation = drag.rotateBefore;
    piece.el.classList.remove('valid', 'invalid', 'rotate-armed');
    render(piece);
  }
  drag = null;
}

svg.addEventListener('pointermove', onPointerMove);
svg.addEventListener('pointerup', onPointerUp);
svg.addEventListener('pointercancel', onPointerCancel);

// ---------------------------------------------------------------------------
// Win / levels
// ---------------------------------------------------------------------------
function isResolved(p) { return p.parent ? isResolved(p.parent) : p.onBoard; }

function checkWin() {
  const won = pieces.length > 0 && pieces.every(isResolved);
  document.getElementById('boardStroke').setAttribute('stroke', won ? '#4ade80' : '#ff8c00');
  if (won) {
    const more = currentLevel < LEVELS.length - 1;
    statusEl.textContent = more
      ? `Level ${currentLevel+1} Complete!`
      : `Level ${currentLevel+1} Complete! Da het level.`;
    statusEl.classList.add('win');
    nextLevelBtn.style.display = more ? 'inline-block' : 'none';
  } else {
    statusEl.textContent = '';
    statusEl.classList.remove('win');
    nextLevelBtn.style.display = 'none';
  }
  return won;
}

function buildLevel() {
  lyBlue.textContent = ''; lyGreen.textContent = ''; hideGuide();
  pieces = []; drag = null;

  const bs = document.getElementById('boardStroke');
  bs.setAttribute('x', BOARD_X - 4); bs.setAttribute('y', BOARD_Y - 4);
  bs.setAttribute('width', BOARD + 8); bs.setAttribute('height', BOARD + 8);
  bs.setAttribute('stroke', '#ff8c00');

  const cfg = LEVELS[currentLevel];
  const greenShapes = cfg.greens.flatMap(g => Array(g.count).fill(g.shape));
  const perRow = 5, gap = 40;

  const label = document.getElementById('trayLabel');
  label.setAttribute('x', 60); label.setAttribute('y', BOARD_Y + BOARD + 60);

  let y = BOARD_Y + BOARD + 100;
  greenShapes.forEach((shape, i) => {
    const col = i % perRow;
    if (i > 0 && col === 0) y += GREEN + gap;
    makePiece('green', shape, 60 + col * (GREEN + gap), y);
  });
  y += GREEN + gap * 2;

  cfg.blues.forEach((s, i) => makePiece('blue', s, 60 + i * (BLUE + gap), y));

  levelLabelEl.textContent =
    `Level ${currentLevel+1} / ${LEVELS.length} — ${cfg.name} (${greenShapes.length} hop xanh la + ${cfg.blues.length} hop xanh duong)`;
  checkWin();
}

// ---------------------------------------------------------------------------
// Scenarios (deterministic screenshots: ?scenario=NAME&level=N&hitbox=1)
// ---------------------------------------------------------------------------
function put(piece, rawX, rawY) { return commit(piece, planDrop(piece, rawX, rawY)); }

// Known-good nesting slots per container shape, in the container's own
// local (unrotated) frame -- see the LEVELS capacity-budget comment above
// for how these numbers were derived. This is what makes autoSolve() a
// real feasibility check for ANY level in this format, not just the
// original two: it is not a search/solver, just a lookup of the one known
// packing this game was designed around.
const CONTAINER_SLOTS = {
  square: [[0,0],[GREEN,0],[0,GREEN],[GREEN,GREEN]],      // 2x2, zero slack
  circle: [[(BLUE-GREEN)/2, (BLUE-GREEN)/2]],              // 1, centred
  // no 'triangle' entry -- see the LEVELS comment; a level using one must
  // be checked by hand.
};

// Fills each blue container up to its known capacity (freeing up board-strip
// room), leaving the rest of the greens untouched in the tray. Reusable on
// its own for the "nest" screenshot scenario (assemble before placing on
// the board), and as the first step of autoSolve().
function nestSome() {
  const greens = pieces.filter(p => p.color === 'green' && !p.parent);
  const blues = pieces.filter(p => p.color === 'blue');
  let gi = 0;
  for (const b of blues) {
    const slots = CONTAINER_SLOTS[b.shape] || [];
    const sw = worldPos(b);
    for (const [lx, ly] of slots) {
      if (gi >= greens.length) break;
      put(greens[gi], sw.x + lx, sw.y + ly);
      gi++;
    }
  }
}

// Attempts the one known-good packing for the CURRENT level: nest into both
// blues up to capacity, place the blues side by side on the board, fill the
// board strip. Returns whether everything got placed -- this IS the
// solvability check a level designer should run after adding/editing a
// level (see README "Adding a level"), not just a screenshot helper.
function autoSolve() {
  nestSome();
  const blues = pieces.filter(p => p.color === 'blue');
  blues.forEach((b, i) => put(b, BOARD_X + i * BLUE, BOARD_Y));

  const remaining = pieces.filter(p => p.color === 'green' && !p.parent && !p.onBoard);
  const cols = BOARD / GREEN;           // greens across the board
  const rows = (BOARD - BLUE) / GREEN;  // strip left under the blues
  let gi = 0;
  for (let r = 0; r < rows && gi < remaining.length; r++) {
    for (let c = 0; c < cols && gi < remaining.length; c++) {
      put(remaining[gi], BOARD_X + c*GREEN, BOARD_Y + BLUE + r*GREEN);
      gi++;
    }
  }
  const unplaced = remaining.slice(gi);

  renderAll();
  const won = checkWin();
  if (!won && unplaced.length === 0) {
    console.warn('autoSolve: everything placed but checkWin() still false -- investigate.');
  }
  return { won, unplacedCount: unplaced.length, unplaced };
}

const SCENARIOS = {
  tray: () => {},
  nest: () => { nestSome(); renderAll(); },
  solved: () => autoSolve(),
  guide: () => { showGuide(pieces.find(p => p.color==='blue' && p.shape==='circle')); },
  // Shows all four quarter-turns side by side, using real triangle pieces
  // (level 2 has exactly 4) laid out in guaranteed headroom near the top.
  rotated: () => {
    const tris = pieces.filter(p => p.shape === 'triangle');
    const angles = [0, 37, 127, 200];
    tris.forEach((t, i) => {
      t.rotation = angles[i % angles.length];
      commit(t, { kind: 'stage', x: 60 + i * (GREEN + 40), y: 100 });
    });
    renderAll();
  },
  // Nests a 2x2 into the blue square, then spins the whole assembly --
  // proof that children now travel with a rotated container.
  spun: () => {
    const bSq = pieces.find(p => p.color==='blue' && p.shape==='square');
    const g = pieces.filter(p => p.color === 'green').slice(0, 4);
    const sw = worldPos(bSq);
    CONTAINER_SLOTS.square.forEach(([lx,ly], i) => put(g[i], sw.x+lx, sw.y+ly));
    bSq.rotation = 30;
    commit(bSq, { kind: 'stage', x: 500, y: 900 });
    renderAll();
  },
};

function applyUrlScenario() {
  const q = new URLSearchParams(location.search);
  const lvl = parseInt(q.get('level'), 10);
  if (lvl >= 1 && lvl <= LEVELS.length) { currentLevel = lvl - 1; buildLevel(); }
  if (q.get('hitbox') === '1') {
    document.body.classList.add('show-hitbox');
    document.getElementById('hitboxToggle').checked = true;
  }
  const s = q.get('scenario');
  if (s && SCENARIOS[s]) SCENARIOS[s]();
}

document.getElementById('resetBtn').addEventListener('click', buildLevel);
nextLevelBtn.addEventListener('click', () => {
  if (currentLevel < LEVELS.length - 1) { currentLevel++; buildLevel(); }
});
document.getElementById('hitboxToggle').addEventListener('change', (e) => {
  document.body.classList.toggle('show-hitbox', e.target.checked);
});

buildLevel();
applyUrlScenario();

window.DBG = {
  get pieces() { return pieces; },
  get level() { return currentLevel; },
  set level(v) { currentLevel = v; buildLevel(); },
  geomOf, worldGeom, worldPos, effectiveRotation, rectGeom, boardGeom, boardKeepOut, shapesOverlap,
  shapeContains, pointInShape, validOnBoard, validInside, validStaged,
  planDrop, commit, put, detach, nestAtWorld, isResolved, checkWin, buildLevel,
  containerUnder, snap, autoSolve, nestSome, renderAll, svgPoint,
  rotatePt, motifPath, checkRotationValid, pieceWorldCenter, CONTAINER_SLOTS,
  MOVE_THRESHOLD, LONG_PRESS_MS, ROTATE_DEADZONE,
  GRID, EPS, GREEN, BLUE, BOARD, BOARD_X, BOARD_Y, CANVAS_W, CANVAS_H, LEVELS
};
</script>
